name: Refresh First Channel playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Extract current HLS URL
        run: python scripts/refresh_pervy_kanal.py
      - name: Commit updated playlist
        run: |
          if git diff --quiet -- PERVY_KANAL.m3u; then
            echo "Playlist unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PERVY_KANAL.m3u
          git commit -m "Refresh First Channel HLS playlist"
          git push
