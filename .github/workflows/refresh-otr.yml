name: Refresh official OTR stream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-otr-stream
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Extract and verify official OTR HLS stream
        run: python scripts/refresh_otr.py
      - name: Commit updated playlist
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "OTR stream unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Refresh official OTR HLS stream"
          git push
